name: Bug report
description: Report a reproducible defect using synthetic data
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Task Manager, Obsidian, OS, and device versions
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux, iOS, Android]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a disposable vault and synthetic task/query text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens, paths, names, task content, and account identifiers.
