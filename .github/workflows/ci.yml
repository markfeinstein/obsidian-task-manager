name: CI

on:
  push:
    branches: [main, master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request' && matrix.node == 22
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin release npm
        run: npm install --global npm@10.9.2
      - name: Assert release toolchain
        run: node scripts/check-toolchain.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test with global, risk-module, and changed-line coverage gates
        if: matrix.node == 22
        env:
          COVERAGE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before || 'HEAD^') }}
        run: npm run test:coverage
      - name: Upload coverage evidence
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Test on secondary Node
        if: matrix.node != 22
        run: npm test
      - name: Run named accessibility contract
        if: matrix.node == 22
        run: npm run test:a11y
      - name: Typecheck
        run: npm run typecheck
      - name: Audit full lockfile
        if: matrix.node == 22
        run: npm audit --audit-level=high
      - name: Audit production dependencies
        if: matrix.node == 22
        run: npm audit --omit=dev --audit-level=high
      - name: Lint against path/rule warning baseline
        if: matrix.node == 22
        run: npm run lint
      - name: Reject warnings on changed lines
        if: matrix.node == 22
        env:
          LINT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.created && 'HEAD^' || (github.event_name == 'push' && github.event.before || 'HEAD^')) }}
        run: npm run lint:changed
      - name: Validate documentation and generated references
        if: matrix.node == 22
        run: npm run check:docs

  platform-core:
    name: Focused product suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Pin release npm
        run: npm install --global npm@10.9.2
      - name: Assert release toolchain
        run: node scripts/check-toolchain.mjs
      - name: Install dependencies
        run: npm ci
      - name: Exercise core parsing, query, mutation, host mock, and package contracts
        run: npm test -- tests/date-utils.test.ts tests/task-query-service.test.ts tests/task-mutation-service.test.ts tests/obsidian-harness.test.ts tests/package-helpers.test.mjs
      - name: Check release metadata
        run: npm run check:version
      - name: Build and validate the production package on this platform
        run: npm run build:prod && npm run check:package
      - name: Require generated assets to match the checkout
        run: git diff --exit-code -- main.js styles.css

  timezone-core:
    name: Date/recurrence (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/New_York, Europe/Berlin, Asia/Kolkata]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Pin release npm
        run: npm install --global npm@10.9.2
      - name: Assert release toolchain
        run: node scripts/check-toolchain.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run timezone-sensitive date and recurrence contracts
        run: npm test -- tests/date-utils.test.ts tests/recurrence-series.test.ts tests/nlp-parser.test.ts tests/task-query.test.ts

  release-validation:
    name: Release validation
    needs: [quality, platform-core, timezone-core, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Pin release npm
        run: npm install --global npm@10.9.2
      - name: Assert release toolchain
        run: node scripts/check-toolchain.mjs
      - name: Install dependencies
        run: npm ci
      - name: Download benchmark evidence for this source revision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark-evidence
      - name: Validate and package exact artifacts using upstream quality evidence
        run: npm run check:release -- --reuse-quality --benchmark-evidence benchmark-evidence/results.json
      - name: Require an explicit publication stage for tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OBSIDIAN_RELEASE_STAGE: ${{ vars.OBSIDIAN_RELEASE_STAGE }}
        run: |
          case "${OBSIDIAN_RELEASE_STAGE:-}" in
            initial-submission|ga) ;;
            *)
              echo "Set the OBSIDIAN_RELEASE_STAGE repository variable to initial-submission or ga." >&2
              exit 1
              ;;
          esac
      - name: Require owner configuration before initial submission publication
        if: startsWith(github.ref, 'refs/tags/') && vars.OBSIDIAN_RELEASE_STAGE == 'initial-submission'
        env:
          OWNER_RELEASE_CONFIG_JSON: ${{ secrets.OWNER_RELEASE_CONFIG_JSON }}
        run: npm run check:initial-release
      - name: Require owner and real-host evidence before public GA publication
        if: startsWith(github.ref, 'refs/tags/') && vars.OBSIDIAN_RELEASE_STAGE == 'ga'
        env:
          GA_EVIDENCE_JSON: ${{ secrets.GA_EVIDENCE_JSON }}
          OWNER_RELEASE_CONFIG_JSON: ${{ secrets.OWNER_RELEASE_CONFIG_JSON }}
        run: npm run check:ga-evidence
      - name: Upload tested release files, checksums, and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-manager-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  attest-release:
    name: Attest approved tag artifact
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-validation
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the exact validated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: task-manager-${{ github.sha }}
          path: release
      - name: Attest tag release subjects
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css
            release/*.zip
            release/mcp-companion.mjs
            release/SHA256SUMS
            release/release-metadata.json
            release/sbom.cdx.json

  performance:
    name: Performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Pin release npm
        run: npm install --global npm@10.9.2
      - name: Assert release toolchain
        run: node scripts/check-toolchain.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run quick benchmark gate
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm run benchmark
      - name: Run full p95/heap benchmark profile
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run benchmark:full
      - name: Generate bundle contributor analysis
        run: npm run analyze:bundle
      - name: Upload benchmark distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved tag artifact
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-validation, attest-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download the exact validated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: task-manager-${{ github.sha }}
          path: release
      - name: Verify artifact version, source revision, and checksums
        shell: bash
        run: |
          expected="$(node -p 'require("./release/release-metadata.json").version')"
          source_revision="$(node -p 'require("./release/release-metadata.json").sourceRevision')"
          test "$GITHUB_REF_NAME" = "$expected"
          test "$source_revision" = "$GITHUB_SHA"
          (cd release && sha256sum --check SHA256SUMS)
      - name: Publish the exact validated package, checksums, metadata, and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/main.js release/manifest.json release/styles.css release/*.zip release/mcp-companion.mjs release/SHA256SUMS release/release-metadata.json release/sbom.cdx.json --verify-tag --generate-notes
